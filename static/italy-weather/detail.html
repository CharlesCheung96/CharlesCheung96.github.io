*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:880px;margin:auto;padding:18px 16px 52px}

.weather,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.weather.high{border:2px solid #ef4444;background:linear-gradient(180deg,rgba(254,226,226,.7),#fff)}.title{font-size:18px;font-weight:800;margin-bottom:12px}.wxmain{display:flex;justify-content:space-between;gap:12px;align-items:center}.wxdesc{font-size:18px;font-weight:800}.temp{font-size:24px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.metric{background:#f8fafc;border-radius:12px;padding:10px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:14px}.risk{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--badbg);border:1px solid #fca5a5;color:var(--bad);font-weight:700}
.timeline{position:relative;margin-top:4px}.item{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.time{font-weight:800;color:#334155}.event b{display:block;margin-bottom:3px}.event span{color:var(--muted);font-size:13px;line-height:1.55}.fixed{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:700}.hotel{display:grid;gap:8px}.hotel-row{display:grid;grid-template-columns:76px 1fr;gap:12px}.hotel-row span:first-child{color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.nav a{flex:1;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.nav a:last-child{text-align:right}.muted{color:var(--muted);font-size:13px;line-height:1.6}.empty{color:var(--muted)}

function fmt(v,s=''){return v==null?'—':Math.round(v)+s}
function riskOf(x,p){const reasons=[];let level=0;if(x.code>=95){level=2;reasons.push('雷暴')}if((x.pop??0)>=60||(x.rain??0)>=8){level=Math.max(level,2);reasons.push('明显降雨')}else if((x.pop??0)>=35||(x.rain??0)>=3){level=Math.max(level,1);reasons.push('可能降雨')}if((x.gust??0)>=55){level=Math.max(level,2);reasons.push('强阵风')}else if((x.gust??0)>=40){level=Math.max(level,1);reasons.push('大风')}if((x.min??99)<=0){level=Math.max(level,2);reasons.push('低于/接近 0°C')}else if(p.name.includes('多洛米蒂')&&(x.min??99)<=4){level=Math.max(level,1);reasons.push('高海拔低温')}return{level,reasons}}

async function weather(){
 const p=day.place,u=new URL('https://api.open-meteo.com/v1/forecast');
 u.searchParams.set('latitude',p.lat);u.searchParams.set('longitude',p.lon);u.searchParams.set('daily','weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max');u.searchParams.set('timezone','Europe/Rome');u.searchParams.set('forecast_days','16');
 try{const r=await fetch(u),j=await r.json(),i=j.daily.time.indexOf(day.date);if(i<0){document.getElementById('weatherBody').textContent='尚未进入 16 天预报窗口。';return}
 const x={code:j.daily.weather_code[i],max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i],rain:j.daily.precipitation_sum[i],pop:j.daily.precipitation_probability_max[i],gust:j.daily.wind_gusts_10m_max[i]},wc=wxCodes[x.code]||['🌡️','天气'],rr=riskOf(x,p);
 if(rr.level===2)document.getElementById('weatherCard').classList.add('high');
 document.getElementById('weatherBody').innerHTML='<div class="wxmain"><div><div class="wxdesc">'+wc[0]+' '+wc[1]+'</div><div class="muted">'+p.name+'</div></div><div class="temp">'+fmt(x.max,'°')+' / '+fmt(x.min,'°')+'</div></div><div class="metrics"><div class="metric"><span>降雨概率</span><b>'+fmt(x.pop,'%')+'</b></div><div class="metric"><span>降水量</span><b>'+Number(x.rain??0).toFixed(1)+' mm</b></div><div class="metric"><span>最大阵风</span><b>'+fmt(x.gust,' km/h')+'</b></div></div>'+(rr.level===2?'<div class="risk">⚠️ 高风险天气：'+rr.reasons.join('、')+'</div>':'');
 }catch(e){document.getElementById('weatherBody').textContent='天气加载失败，请稍后刷新。'}
